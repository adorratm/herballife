# Build → GHCR → SSH zero-downtime deploy
# Secrets: bkz. deploy/SECRETS.md
name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      seed:
        description: "Boş DB olmasa bile seed çalıştır (SEED_ON_DEPLOY=1)"
        type: boolean
        default: false
      skip_deploy:
        description: "Yalnızca GHCR build/push (deploy yok)"
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  # type=gha cache yazımı için (yoksa blob not_found / cache export fail)
  actions: write

jobs:
  build:
    name: Build & push GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image meta
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          {
            echo "owner=${OWNER}"
            echo "repo=${REPO}"
            echo "version=sha-${SHA_SHORT}"
            echo "prefix=${{ env.REGISTRY }}/${OWNER}/${REPO}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve public build args
        id: args
        env:
          V_API: ${{ vars.NEXT_PUBLIC_API_URL }}
          V_SITE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          V_ADMIN: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          V_CDN: ${{ vars.NEXT_PUBLIC_CDN_URL }}
          V_GA4: ${{ vars.NEXT_PUBLIC_GA4_ID }}
          V_GTM: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          V_ADS: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
          V_META: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          V_GSV: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          V_REGION: ${{ vars.AWS_REGION }}
          S_API: ${{ secrets.NEXT_PUBLIC_API_URL }}
          S_SITE: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          S_ADMIN: ${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
          S_CDN: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
          S_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          S_CDN_URL: ${{ secrets.AWS_CDN_URL }}
        run: |
          pick() { local a="$1" b="$2" d="$3"; if [ -n "$a" ]; then echo "$a"; elif [ -n "$b" ]; then echo "$b"; else echo "$d"; fi; }
          {
            echo "api=$(pick "$V_API" "$S_API" "https://api.herbalkapida.com")"
            echo "site=$(pick "$V_SITE" "$S_SITE" "https://herbalkapida.com")"
            echo "admin=$(pick "$V_ADMIN" "$S_ADMIN" "https://admin.herbalkapida.com")"
            echo "cdn=$(pick "$V_CDN" "$S_CDN" "")"
            echo "ga4=${V_GA4}"
            echo "gtm=${V_GTM}"
            echo "ads=${V_ADS}"
            echo "meta=${V_META}"
            echo "gsv=${V_GSV}"
            echo "region=$(pick "$V_REGION" "" "eu-central-1")"
            echo "bucket=${S_BUCKET}"
            echo "aws_cdn=${S_CDN_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/api:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/api:latest
          # ignore-error: image push başarılıysa cache export hatası job’u düşürmesin
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=min,scope=api,ignore-error=true

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.args.outputs.api }}
            NEXT_PUBLIC_SITE_URL=${{ steps.args.outputs.site }}
            NEXT_PUBLIC_ADMIN_URL=${{ steps.args.outputs.admin }}
            NEXT_PUBLIC_CDN_URL=${{ steps.args.outputs.cdn }}
            NEXT_PUBLIC_GA4_ID=${{ steps.args.outputs.ga4 }}
            NEXT_PUBLIC_GTM_ID=${{ steps.args.outputs.gtm }}
            NEXT_PUBLIC_GOOGLE_ADS_ID=${{ steps.args.outputs.ads }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ steps.args.outputs.meta }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ steps.args.outputs.gsv }}
            AWS_S3_BUCKET=${{ steps.args.outputs.bucket }}
            AWS_REGION=${{ steps.args.outputs.region }}
            AWS_CDN_URL=${{ steps.args.outputs.aws_cdn }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=min,scope=frontend,ignore-error=true

      - name: Build & push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/admin:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/admin:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.args.outputs.api }}
            NEXT_PUBLIC_ADMIN_URL=${{ steps.args.outputs.admin }}
            NEXT_PUBLIC_SITE_URL=${{ steps.args.outputs.site }}
            NEXT_PUBLIC_CDN_URL=${{ steps.args.outputs.cdn }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=min,scope=admin,ignore-error=true

  deploy:
    name: Zero-downtime deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_deploy != true)
    # Repository secrets kullanılır (Settings → Secrets and variables → Actions).
    # Environment şartı yok — yanlış isimli environment secret'ları boş gelmesin.
    steps:
      - name: Checkout (compose + deploy scripts)
        uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for k in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!k}" ]; then
              echo "::error::Secret eksik: $k"
              echo "::error::Ekle: https://github.com/${{ github.repository }}/settings/secrets/actions"
              echo "::error::Repository secrets → New repository secret (Environment değil)"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Gerekli: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY — bkz. deploy/SECRETS.md"
            exit 1
          fi

      - name: Resolve deploy path / port
        id: dest
        env:
          P: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          echo "path=${P:-/opt/herbalkapida}" >> "$GITHUB_OUTPUT"
          echo "port=${PORT:-22}" >> "$GITHUB_OUTPUT"

      # appleboy/scp|ssh composite oldu → wretry saramıyor.
      # Native ssh + bash retry (Docker NAT handshake reset'ini de azaltır).
      - name: Setup SSH agent
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ steps.dest.outputs.port }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "${DEPLOY_SSH_PASSPHRASE:-}" ]; then
            umask 077
            PASS_FILE=$(mktemp)
            printf '%s' "$DEPLOY_SSH_PASSPHRASE" > "$PASS_FILE"
            printf '#!/bin/sh\ncat %q\n' "$PASS_FILE" > /tmp/ssh-askpass.sh
            chmod 700 /tmp/ssh-askpass.sh
            DISPLAY=:0 SSH_ASKPASS=/tmp/ssh-askpass.sh SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
            rm -f /tmp/ssh-askpass.sh "$PASS_FILE"
          else
            ssh-add ~/.ssh/deploy_key
          fi

      - name: Sync files to server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ steps.dest.outputs.port }}
          TARGET: ${{ steps.dest.outputs.path }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15)
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 4 ] && { echo "::error::SSH/SCP 4 denemede başarısız"; return 1; }
              echo "Bağlantı hatası — ${n}/4, 20s sonra tekrar..."
              sleep 20
            done
          }
          CANDIDATES=(
            docker-compose.prod.yml
            deploy/deploy.sh
            deploy/.env.production.example
            docker/api.Dockerfile
            docker/frontend.Dockerfile
            docker/admin.Dockerfile
          )
          FILES=()
          for f in "${CANDIDATES[@]}"; do
            if [ -e "$f" ]; then
              FILES+=("$f")
            else
              echo "::warning::Sync atlandı (yok): $f"
            fi
          done
          [ "${#FILES[@]}" -gt 0 ] || { echo "::error::Sync edilecek dosya yok"; exit 1; }
          retry ssh "${SSH_OPTS[@]}" -p "$PORT" "${REMOTE_USER}@${HOST}" \
            "mkdir -p '${TARGET}/deploy' '${TARGET}/frontend/public/downloads' '${TARGET}/docker'"
          retry bash -c "set -o pipefail; tar czf - ${FILES[*]} | ssh ${SSH_OPTS[*]} -p \"$PORT\" \"${REMOTE_USER}@${HOST}\" \"cd '${TARGET}' && tar xzf -\""

      - name: Bootstrap + rolling deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ steps.dest.outputs.port }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN != '' && secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USER != '' && secrets.GHCR_PULL_USER || github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_OWNER: ${{ needs.build.outputs.owner }}
          GHCR_REPO: ${{ needs.build.outputs.repo }}
          DEPLOY_PATH: ${{ steps.dest.outputs.path }}
          DEPLOY_ENV_CONTENT: ${{ secrets.DEPLOY_ENV }}
          SEED_FLAG: ${{ github.event_name == 'workflow_dispatch' && inputs.seed && '1' || '0' }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15)
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 3 ] && { echo "::error::Remote deploy 3 denemede başarısız"; return 1; }
              echo "SSH hata — ${n}/3, 15s sonra tekrar..."
              sleep 15
            done
          }
          {
            printf '#!/usr/bin/env bash\nset -euo pipefail\n'
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            printf 'export GHCR_USER=%q\n' "$GHCR_USER"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'export GHCR_OWNER=%q\n' "$GHCR_OWNER"
            printf 'export GHCR_REPO=%q\n' "$GHCR_REPO"
            printf 'export DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
            printf 'export DEPLOY_ENV_CONTENT=%q\n' "$DEPLOY_ENV_CONTENT"
            printf 'export SEED_FLAG=%q\n' "$SEED_FLAG"
            cat <<'EOS'
          mkdir -p "$DEPLOY_PATH/deploy" "$DEPLOY_PATH/frontend/public/downloads" "$DEPLOY_PATH/docker"
          cd "$DEPLOY_PATH"
          chmod +x deploy/deploy.sh 2>/dev/null || true

          if [ -n "${DEPLOY_ENV_CONTENT:-}" ]; then
            if [ -f deploy/.env ]; then
              cp -a deploy/.env "deploy/.env.bak.$(date +%Y%m%d%H%M%S)" || true
            fi
            printf '%s\n' "$DEPLOY_ENV_CONTENT" > deploy/.env
            sed -i 's/\r$//' deploy/.env || true
            chmod 600 deploy/.env
            echo "deploy/.env DEPLOY_ENV secret'tan yazıldı/güncellendi"
          elif [ ! -f deploy/.env ]; then
            cp deploy/.env.production.example deploy/.env
            sed -i 's/\r$//' deploy/.env || true
            chmod 600 deploy/.env
            echo "deploy/.env örnekten oluşturuldu — JWT/DB şifrelerini güncelleyin"
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export HERBAL_KAPIDA_USE_REGISTRY=1
          export IMAGE_TAG GHCR_OWNER GHCR_REPO
          export SEED_ON_DEPLOY="${SEED_FLAG:-0}"
          bash deploy/deploy.sh
          EOS
          } > /tmp/remote-deploy.sh

          retry scp "${SSH_OPTS[@]}" -P "$PORT" \
            /tmp/remote-deploy.sh "${REMOTE_USER}@${HOST}:/tmp/herbal-remote-deploy.sh"
          retry ssh "${SSH_OPTS[@]}" -p "$PORT" \
            "${REMOTE_USER}@${HOST}" "bash /tmp/herbal-remote-deploy.sh; rm -f /tmp/herbal-remote-deploy.sh"
